[env:waveshare_esp32_s3_zero]
platform = https://github.com/tasmota/platform-espressif32.git
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200

; CPU Frequenz auf Maximum für schnelle FFT/RMS Berechnung
board_build.f_cpu = 240000000L

; Flash Mode für den S3 Zero (oft notwendig, wenn OPI PSRAM verbaut ist)
board_build.arduino.memory_type = qio_opi

build_flags = 
    -D CORE_DEBUG_LEVEL=3
